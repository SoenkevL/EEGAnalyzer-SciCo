# config file for running experiments
# two levels are used for defining the parameters. Experiments and runs. Each config can have multiple experiments
# which in turn can have multiple runs
experiments:
  -
    # required, name of the experiment for logging
    name: initial_metrics_set
    # optional, further information on the dataset (can be left empty)
    description: the first set of metrics we decided on to compute
    # required, sql database that stores information, can be shared for multiple datasets
    sqlite_path: ./EEGAnalyzer.sqlite
    # required, root bids folder, should end in BIDS but not necessary, the folder (and subfolders) will be scanned for fif files
    bids_folder: /home/soenke/PycharmProjects/MysticalEntropy/MysticalEntropyData/converted
    # required, input file type, the type of files that should be treated as valid input files
    input_file_ending: 'raw.fif'
    # Metrics are specified in a metrics.py file
    # required, Path where the metrics.py file can be found
    metric_path: ./metrics.py
    # required, The name of the metric_set which should be used for computation
    metric_set_name: first-metric-set-MysticalEntropy
    # optional, annotations for which metrics should be calculated.
    # Need to be given as a list with the '-' infront of the option
    # - Leaving it empty calcs metrics for the whole file
    # - giving the keyword 'all' calculates it for all annotations in the file (nothing computed if there are no annotations)
    annotations_of_interest:
      - YRS
      - SRS
      - Sahasrara
      - Manipura
      - Anahata
      - Ajna
    #if the signal of interest should be epoched, for using the whole file/annotation leave all empty
    epoching:
      #optional, offset in seconds from beginning of file/annotation, leaving it empty fills 0
      start_time: 0
      #optional, length of the epochs, if left empty the whole file/annotation length will be used
      duration: 10
      #optional, overlap is used in a sliding window approach to make steps, has to be
      #strictly less than duration or will be set to 0 within computation
      overlap: 8
      #optional, epochs are done from start to stop with only full intervals beeing calculated, no stop time means end of file/annotation
      stop_time:
    # the name of the output file, has to end with metrics.csv for using the processing notebooks
    outfile_ending: 'metrics.csv'
    # if files which allready exist should be recomputed
    recompute: True
    # definition of the different runs for this experiment where montage and filtering can be adapted
    runs:
      -
        #required, name of the run for debugging
        name: low_35
        #optional, filter settings to apply to eeg, can be left empty
        # not specifying a l_freq or h_freq means no filtering will be applied for the lower or upper bound
        # filters are defined to filter inbetween l_freq and h_freq, some examples:
        # - l_freq=1 and h_freq=4 is a bandpass filter between 1 and 4 Hz
        # - l_freq=1, h_freq=None is a highpass filter of 1 Hz
        # - l_freq=4, and h_freq=1 is a bandstop filter 1-4 Hz
        filter:
          h_freq: 35
          l_freq: 1
        #optional, sampling freq of the signal to resample to, can be left empty
        sfreq: 500
        #required, montage that should be used, out of 'avg', 'circumferential', 'doublebanana'
        montage: avg
        # folder structure, final results are saved at <root_bids_folder>/metrics<metrics_prefix>/<outfile_ending>
        # optional, should be of form '/<folder1>/<folder2>' can be done with N folders
        metrics_prefix: /low_35/avg